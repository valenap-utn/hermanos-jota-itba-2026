<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Producto | Hermanos Jota</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <!-- Fontawesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/detalle-producto.css">
</head>

<body class="d-flex flex-column min-vh-100">

<!-- Header compartido -->
<div id="header-placeholder"></div>

<main class="flex-grow-1">
    <div class="container py-4 py-lg-5">

        <!-- Navegación hacia el catálogo -->
        <nav aria-label="Migas de pan" class="mb-4">
            <ol class="breadcrumb detalle-breadcrumb">
                <li class="breadcrumb-item">
                    <a href="productos.html">Productos</a>
                </li>

                <!-- El nombre se completa dinámicamente desde producto.js -->
                <li class="breadcrumb-item active"
                    aria-current="page"
                    data-detalle="breadcrumb">
                </li>
            </ol>
        </nav>

        <article class="row g-4 g-lg-5">

            <!-- Imagen principal del producto -->
            <div class="col-12 col-lg-7">
                <figure class="detalle-figura mb-0">
                    <img alt=""
                         class="detalle-imagen"
                         data-detalle="imagen">
                </figure>
            </div>

            <!-- Información principal del producto -->
            <div class="col-12 col-lg-5">

                <p class="detalle-categoria texto-secundario-leyenda mb-2"
                   data-detalle="categoria">
                </p>

                <h1 class="texto-titulo-elegante detalle-nombre"
                    data-detalle="nombre">
                </h1>

                <!-- El catálogo no define precios. Se muestra "Precio a confirmar" mientras precio sea 0. -->
                <p class="detalle-precio texto-enfasis-editorial"
                   data-detalle="precio">
                </p>

                <p class="texto-principal detalle-descripcion"
                   data-detalle="descripcion">
                </p>

                <button type="button"
                        class="btn detalle-btn-carrito texto-titulo-cta w-100 mb-3"
                        data-detalle="btn-carrito">
                    <i class="fa-solid fa-cart-plus me-2" aria-hidden="true"></i>
                    Añadir al Carrito
                </button>

                <p class="texto-secundario-leyenda detalle-envio mb-0">
                    <i class="fa-solid fa-truck me-1" aria-hidden="true"></i>
                    Envío sin cargo en CABA y GBA. Entrega estimada: 15 a 20 días hábiles.
                </p>

            </div>

            <!-- Especificaciones técnicas -->
            <div class="col-12">
                <section class="detalle-specs mt-2 mt-lg-4">

                    <h2 class="texto-titulo-elegante detalle-specs-titulo mb-3">
                        Detalles de fabricación
                    </h2>

                    <div class="table-responsive">
                        <table class="table detalle-tabla">

                            <!-- Se completa con el nombre del producto para lectores de pantalla -->
                            <caption class="visually-hidden"
                                     data-detalle="caption-specs">
                            </caption>

                            <!-- Las filas se generan dinámicamente desde producto.js -->
                            <tbody data-detalle="specs">
                            </tbody>

                        </table>
                    </div>

                </section>
            </div>

        </article>
    </div>
</main>

<!-- Footer compartido -->
<div id="footer-placeholder"></div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
<script src="../js/layout.js"></script>
<script type="module" src="../js/carrito.js"></script>

<!-- Renderiza el detalle según el ID recibido por URL -->
<script type="module" src="../js/producto.js"></script>
</body>
</html>
