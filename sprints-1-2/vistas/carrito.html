<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Carrito</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <!-- Fontawesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/carrito.css">
</head>
<body class="d-flex flex-column min-vh-100">

<div id="header-placeholder"></div>

<main class="flex-grow-1">
    <div id="carrito-status" class="visually-hidden"
         aria-live="polite" aria-atomic="true"
    >
    </div>

    <div id="carrito-container" class="container min-vh-50"></div>
</main>

<div id="footer-placeholder"></div>

<!-- Pop-up de confirmación de eliminación de item del carrito-->

<div
        class="modal fade"
        id="modalEliminarProducto"
        tabindex="-1"
        aria-labelledby="modalEliminarProductoTitulo"
        aria-describedby="modalEliminarProductoDescripcion"
        aria-hidden="true"
>
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content modal-carrito">

            <div class="modal-header">
                <h2
                        class="modal-title texto-titulo-elegante"
                        id="modalEliminarProductoTitulo"
                >
                    Eliminar producto
                </h2>

                <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                        aria-label="Cerrar"
                ></button>
            </div>

            <div class="modal-body">
                <p id="modalEliminarProductoDescripcion">
                    ¿Estás seguro de que querés eliminar este producto de tu carrito?
                </p>
            </div>

            <div class="modal-footer">
                <button
                        type="button"
                        class="btn-carrito-cancelar texto-titulo-cta"
                        data-bs-dismiss="modal"
                >
                    Cancelar
                </button>

                <button
                        type="button"
                        id="confirmar-eliminar-producto"
                        class="btn-carrito-eliminar texto-titulo-cta"
                >
                    Eliminar
                </button>
            </div>

        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
<script src="../js/layout.js"></script>
<script type="module" src="../js/carrito.js"></script>
<script type="module" src="../js/vistaCarrito.js"></script>
</body>
</html>
